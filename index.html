<!doctype html>
<html lang="zh-CN" data-skin="terminal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="考研计时" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>考研计时</title>
    <script>
      // 首屏前套用上次选择的皮肤和明暗，避免闪一下默认外观（键名与 src/skin.ts 一致）
      ;(function () {
        var root = document.documentElement
        var skin = null
        var mode = null
        try {
          skin = localStorage.getItem('kaoyan.skin')
          mode = localStorage.getItem('kaoyan.mode')
        } catch (e) {}
        if (skin === 'brutal' || skin === 'paper') root.dataset.skin = skin
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.mode = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
